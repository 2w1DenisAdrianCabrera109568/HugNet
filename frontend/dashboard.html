<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HugNet | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
</head>

<body class="app-layout-dashboard">

  <div class="d-flex">

    <!-- Barra lateral (Sidebar) -->
    <nav id="sidebar" class="d-flex flex-column p-3 text-white bg-primary shadow">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="menu.html" class="navbar-brand fw-bold text-center flex-grow-1">
          HugNet
        </a>
        <!-- Boton para cerrar sidebar en moviles -->
        <button id="closeSidebarBtn" class="btn btn-close btn-close-white d-md-none ms-2"></button>
      </div>

      <!-- Info del Usuario -->
      <div class="user-info text-center border-top pt-3">
        <p class="mb-0 small">Conectado como:</p>
        <p id="userName" class="fw-bold small"></p>
      </div>

      <!-- Navegacion Principal (Generada por app.js) -->
      <ul id="sidebar-nav" class="nav nav-pills flex-column mb-auto">
        <!-- Los items <li> se generan dinamicamente por app.js -->
      </ul>
      <ul id="sidebar-utility-nav" class="nav nav-pills flex-column">
        <!-- Los items <li> se generan dinamicamente por app.js -->
      </ul>

      <hr>
      <!-- Boton de Salir -->
      <div class="d-grid">
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesion
        </button>
      </div>
    </nav>

    <!-- Contenido Principal -->
    <main id="main-content" class="w-100 p-4">
      <!-- Boton para abrir sidebar en moviles -->
      <button id="openSidebarBtn" class="btn btn-primary d-md-none mb-3 sidebar-toggle">
        <i class="bi bi-list me-2"></i>Menu
      </button>

      <!-- Titulo del Contenido (Dinamico) -->
      <h2 id="content-title" class="text-primary fw-bold mb-4">Dashboard</h2>

      <!-- Area del Contenido (Dinamico) -->
      <div id="content-area" class="card shadow-sm border-0">
        <div class="card-body p-4">
          Cargando contenido...
        </div>
      </div>
    </main>

  </div>
  <!-- Area del Footer -->
  <footer class="footer mt-auto py-3 bg-light border-top">
    <div class="container-fluid text-center">
      <span class="text-muted">
        &copy; 2025 HugNet. Todos los derechos reservados.
      </span> |
      <a href="dashboard.html?view=Acerca%20de%20HugNet">Acerca de HugNet</a> |
      <a href="dashboard.html?view=Contacto">Contacto</a>
    </div>
  </footer>
  <!-- Template de Gestion Usuarios -->
  <template id="users-template">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 text-primary"><i class="bi bi-people-fill me-2"></i>Gestión de Usuarios</h4>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" id="search-user" class="form-control" placeholder="Buscar por email o nombre...">
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Usuario</th>
                            <th scope="col">Email</th>
                            <th scope="col">Rol Actual</th>
                            <th scope="col" class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
  </template>
  <!-- Template de Perfil -->
  <template id="profile-template">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <div class="mb-3">
                        <i class="bi bi-person-circle display-1"></i>
                    </div>
                    <h4 id="profile-name">Cargando...</h4>
                    <span id="profile-role" class="badge bg-light text-primary">...</span>
                </div>
                <div class="card-body p-4">
                    <h6 class="text-muted text-uppercase small mb-3">Información de Contacto</h6>
                    
                    <div class="mb-3">
                        <label class="fw-bold text-dark">Email:</label>
                        <p id="profile-email" class="text-muted">...</p>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold text-dark">ID de Usuario:</label>
                        <p id="profile-id" class="text-muted">...</p>
                    </div>

                    <hr class="my-4">

                    <h6 class="text-muted text-uppercase small mb-3">Zona de Peligro</h6>
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-4 me-3"></i>
                        <div>
                            <strong>Eliminar Cuenta</strong>
                            <div class="small">Esta acción es irreversible. Se perderá tu historial.</div>
                        </div>
                        <button class="btn btn-danger ms-auto btn-sm" onclick="deleteMyAccount()">
                            Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </template>
  <!-- Template de Actividades -->
  <template id="activities-template">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 text-primary"><i class="bi bi-calendar-event me-2"></i>Tablero de Actividades</h4>
        
        <button id="btn-create-activity" class="btn btn-success d-none" onclick="openCreateActivityModal()">
            <i class="bi bi-plus-lg me-1"></i> Nueva Actividad
        </button>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="search-activity" class="form-control border-start-0" placeholder="Buscar actividad...">
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Título</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="activityTableBody">
                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
            </tbody>
        </table>
    </div>
  </template>
  <!-- Modal de Crear Actividad -->
  <div class="modal fade" id="createActivityModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Nueva Actividad</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="createActivityForm">
    <div class="mb-3">
        <label for="actTitle" class="form-label fw-bold">Título</label>
        <input type="text" class="form-control" id="actTitle" placeholder="Ej: Colecta de Alimentos" required>
    </div>
    
    <div class="mb-3">
        <label for="actDesc" class="form-label fw-bold">Descripción</label>
        <textarea class="form-control" id="actDesc" rows="3" placeholder="Detalles del evento..." required></textarea>
    </div>

    <div class="row g-2 mb-2">
        <div class="col-12"><label class="form-label fw-bold text-primary">Inicio del Evento</label></div>
        <div class="col-md-6">
            <input type="date" class="form-control" id="actDateStart" required>
        </div>
        <div class="col-md-6">
            <input type="time" class="form-control" id="actTimeStart" required>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-12"><label class="form-label fw-bold text-danger">Fin del Evento</label></div>
        <div class="col-md-6">
            <input type="date" class="form-control" id="actDateEnd" required>
        </div>
        <div class="col-md-6">
            <input type="time" class="form-control" id="actTimeEnd" required>
        </div>
    </div>

    <div class="mb-3">
        <label for="actType" class="form-label fw-bold">Tipo de Actividad</label>
        <select class="form-select" id="actType" required>
            <option value="" selected disabled>Seleccionar...</option>
            <option value="VOLUNTARIADO">Voluntariado</option>
            <option value="DONACION">Campaña de Donación</option>
            <option value="TALLER">Taller / Capacitación</option>
            <option value="EVENTO">Evento Social/Deportivo</option>
            <option value="CHARLA">Charla</option>
        </select>
    </div>
</form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" onclick="submitCreateActivity()">Crear Actividad</button>
      </div>
    </div>
  </div>
  </div>
  <!-- Modal de Asistentes -->
  <div class="modal fade" id="attendeesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-light">
        <h5 class="modal-title"><i class="bi bi-people-fill text-primary me-2"></i>Asistentes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <ul class="list-group list-group-flush" id="attendeesList">
            <li class="list-group-item text-center py-3">Cargando...</li>
        </ul>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
  </div>
  <!-- Modal de Asignar Sponsor -->
  <div class="modal fade" id="assignSponsorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="bi bi-cash-coin me-2"></i>Asignar Sponsor</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="assignSponsorForm">
            <input type="hidden" id="assignActivityId">

            <div class="mb-3">
                <label for="sponsorSelect" class="form-label fw-bold">Seleccionar Sponsor</label>
                <select id="sponsorSelect" class="form-select" required>
                    <option value="" selected disabled>Cargando lista...</option>
                </select>
                <div class="form-text">¿No está en la lista? Ve a Gestión de Sponsors para crearlo.</div>
            </div>

            <div class="mb-3">
                <label for="contributionDesc" class="form-label fw-bold">Descripción del Aporte</label>
                <textarea id="contributionDesc" class="form-control" rows="3" placeholder="Ej: Donación de 50 camisetas, Servicio de Catering, $10.000, etc." required></textarea>
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="submitSponsorAssignment()">Guardar Asignación</button>
      </div>
    </div>
  </div>
  </div>
  <!-- Bootstrap JS (necesario para algunos componentes) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- html2pdf.js (para exportar a PDF) -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- SweetAlert2 (para popups bonitos) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- QRCode.js (para generar codigos QR) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Tu app.js (controla toda la logica) -->
  <script src="js/app.js"></script>
  <!-- Registro del Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('Service Worker registrado: ', reg.scope))
        .catch(err => console.log('Error al registrar SW: ', err));
    });
  }
  </script>

  <!-- 
    REFACTORIZACION:
    El script de toggle para el sidebar movil se ha movido
    dentro de la funcion initDashboardPage() en app.js.
    Esto asegura que los event listeners se adjunten DESPUES
    de que los links del menu (#sidebar-nav a) sean creados.
  -->
</body>

</html>
